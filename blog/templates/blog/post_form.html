{% extends 'blog/base.html' %}
{% block title %}{% if form.instance.pk %}Edit Post{% else %}Create Post{% endif %}{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Edit Post{% else %}Create a Post{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if form.instance.pk %}Save{% else %}Post{% endif %}</button>
</form>
{% endblock %}
