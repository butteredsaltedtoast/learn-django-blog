<!doctype html>
<html>
    <head>
        <title> {% block title %}Blog{% endblock %}</title>

        <style>

            body {
                font-family: Georgia, serif;
                max-width: 700px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.6;
                color: #333;
            }

            a { color: #1a0dab; }

            hr {
                border: none;
                border-top: 1px solid #ddd;
                margin: 20px 0;
            }

            button {
                padding: 8px 16px;
                background: #333;
                color: white;
                border: none;
                cursor: pointer;
            }

            textarea, input[type="text"] {
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            }

            .meta {
                color: #888;
                font-size: 0.85em;
            }

            .nav { margin-bottom: 30px; }

        </style>

    </head>

    <body>

        <div class = "nav">
            <a href = "{% url 'post_list' %}"><strong>Blog</strong></a>
            {% if user.is_authenticated %}
                | {{user.username}} | <a href = "{% url 'ion_logout' %}">Logout</a>
            {% else %}
                | <a href = "{% url 'ion_login' %}">Log in</a>
            {% endif %}
        </div>

        {% block content %}{% endblock %}

    </body>

</html>
